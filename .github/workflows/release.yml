name: Release Validation

on:
  push:
    tags:
      - "v*"

jobs:
  release-validation:
    name: Release Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml 2>/dev/null || true

      - name: Run release validation
        run: python tools/run_all.py --release --json --out run_all.json

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.ref_name }}
          path: |
            release-report.md
            run_all.json

      - name: Fail if validation failed
        run: |
          python -c "
          import json, sys
          d = json.load(open('run_all.json'))
          if d['failed'] > 0:
              print(f'FAIL: {d[\"failed\"]} suite(s) failed')
              sys.exit(1)
          print(f'PASS: {d[\"passed\"]}/{d[\"total\"]} suites')
          "
