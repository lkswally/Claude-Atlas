# ATLAS Knowledge Registry — F29
# Declarative catalog of knowledge files and how they should be loaded into context.
# Purpose: drive the F30 boot-loader redesign from evidence, not guesses.
#
# This registry is DESCRIPTIVE (audit/observability), not enforcing. The boot
# profiler (tools/boot_profiler.py) and a WARN-only healthcheck read it; nothing
# changes runtime loading yet.
#
# load_policy values:
#   always_on    — injected into every session (boot cost paid 100% of the time)
#   lazy         — loaded on demand when a mode/agent/trigger needs it
#   manual       — read by tools/CLI/CI, not into Claude's context by default
#   runtime      — produced/consumed at runtime (logs, state)
#   deprecated   — kept for history; should not load
#   unknown      — not yet classified
#
# Fields per entry:
#   id, path, category, load_policy, owner, required_at_boot, trigger,
#   estimated_tokens, replacement_candidate, duplication_risk, notes
#
# NOTE: estimated_tokens uses the F28/F29 heuristic (bytes / 4). Refresh with:
#   python tools/boot_profiler.py --scan

version: "1.0"
updated: "2026-06-19"

