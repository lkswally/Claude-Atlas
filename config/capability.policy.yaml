# ATLAS Capability Policy — F19
# ==============================
#
# Declarative policies for every registered capability.
# Evaluated by core/capabilities/policy.py via evaluate_capability(name).
#
# Decision outcomes:
#   ALLOW      — capability is usable as-is, proceed
#   WARN       — usable but degraded / not ideal; log and continue
#   DEGRADED   — fallback active or partial functionality; continue with caution
#   BLOCK      — capability unavailable AND block_if_unavailable=true; halt task
#   MISSING_POLICY — no policy entry found for capability
#
# Fields:
#   critical             (bool)   capability is essential to ATLAS core operations
#   required_status      (str)    minimum acceptable provider status:
#                                   LIVE | CONFIG_ONLY | PENDING_TOKEN
#   fallback_allowed     (bool)   whether a lower-priority provider is acceptable
#   allowed_fallbacks    (list)   explicit provider mcp_ids that may serve as fallback
#   block_if_unavailable (bool)   if true and no usable provider => BLOCK decision
#   recovery_hint        (str)    human-readable fix suggestion (logged in events)
#   owner                (str)    which agent/team owns this capability
#   severity             (str)    CRITICAL | HIGH | MEDIUM | LOW — used in alerting

# ---------------------------------------------------------------------------
# Core ATLAS capabilities (critical)
# ---------------------------------------------------------------------------

memory:
  critical: true
  required_status: LIVE
  fallback_allowed: false
  block_if_unavailable: true
  recovery_hint: "Revisar Engram MCP: engram doctor. Asegurar que engram.exe esté en PATH y .mcp.json lo registre."
  owner: orquestador
  severity: CRITICAL

project_management:
