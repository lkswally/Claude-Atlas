# ATLAS MCP Registry
# Inventario declarativo de todos los MCP relevantes para el sistema.
# Actualizado: 2026-06-17
#
# Status values:
#   LIVE             — herramientas mcp__*__ detectadas en sesión activa
#   CONFIG_ONLY      — configurado en .mcp.json pero no visible en sesión actual
#   CLI_ONLY         — binario CLI disponible, sin MCP server configurado
#   MISSING          — ni CLI ni config
#   OPTIONAL         — no requerido por ningún agente core
#   PENDING_TOKEN    — configurado pero necesita token/secret del usuario
#   DEFERRED_PAID    — requiere licencia/API de pago — no instalar
#   NOT_RECOMMENDED  — evaluado: no aporta valor diferencial a ATLAS
#
# Capability values (atlas_capability field):
#   memory | project_management | documentation | browser | computer_control
#   repository | deployment | visualization | scheduling | design
#   database | filesystem | storage | messaging

