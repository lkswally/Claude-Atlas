# ATLAS MCP Registry
# Inventario declarativo de todos los MCP relevantes para el sistema.
# Actualizado: 2026-06-18
#
# Status values:
#   LIVE          — herramientas mcp__*__ detectadas en sesión activa
#   CONFIG_ONLY   — configurado en .mcp.json pero no visible en sesión actual
#   CLI_ONLY      — binario CLI disponible, sin MCP server configurado
#   MISSING       — ni CLI ni config
#   OPTIONAL      — no requerido por ningún agente core

version: "1.0"
updated: "2026-06-18"

mcps:

  # ─── MEMORIA ────────────────────────────────────────────────────────────────

  - id: engram
    name: "Engram Memory"
    provider: "Gentleman-Programming"
    status: CONFIG_ONLY
    config_scope: project
    command: "C:\\Users\\lksro\\go\\bin\\engram.exe"
    args: ["mcp", "--tools=agent"]
    live_tool_prefix: "mcp__engram__"
    config_file: ".mcp.json"
    capabilities:
      - save_memory
      - search_memories
      - list_memories
      - delete_memory
    required_for:
      - orquestador
      - project-manager-senior
      - ux-architect
      - ui-designer
      - frontend-developer
      - backend-architect
      - evidence-collector
      - reality-checker
    validation_command: "C:\\Users\\lksro\\go\\bin\\engram.exe search atlas"
    cli_available: true
    cli_version: "1.16.3"
    cli_path: "C:\\Users\\lksro\\go\\bin\\engram.exe"
    db_path: "C:\\Users\\lksro\\.engram\\engram.db"
    install_notes: |
      Instalado via: go install github.com/Gentleman-Programming/engram@latest
      Para LIVE: .mcp.json debe estar en el CWD raíz de la sesión.
      CWD actual: D:\ProyectosIA — .mcp.json debe estar ahí, no en ProyectosClaude.
    risks:
      - "DB lock en Windows si proceso engram MCP y CLI corren simultáneamente"
      - "engram-sync.js requiere ~/.engram como git repo para sync remoto"
    note: "CONFIG_ONLY porque .mcp.json está en subdirectorio, no en CWD raíz"

  # ─── DOCUMENTACIÓN / NOTAS ──────────────────────────────────────────────────

  - id: notion
    name: "Notion"
    provider: "Notion Labs"
    status: LIVE
    config_scope: plugin
    live_tool_prefix: "mcp__52722bcc-d6c5-4bf4-8d79-ccad7a479b8f__notion-"
    capabilities:
      - create_page
      - update_page
      - fetch_page
      - search
      - create_database
      - create_comment
      - get_comments
    required_for:
      - project-manager-senior
      - orquestador
    validation_command: null
    cli_available: false
    install_notes: "Plugin instalado via Claude Code marketplace"
    risks:
      - "Rate limits en búsquedas masivas"
      - "Acceso limitado a workspaces privados no conectados"

  # ─── BROWSER / QA VISUAL ────────────────────────────────────────────────────

  - id: claude_in_chrome
    name: "Claude in Chrome"
    provider: "Anthropic"
    status: LIVE
    config_scope: plugin
    live_tool_prefix: "mcp__Claude_in_Chrome__"
    capabilities:
      - navigate
      - screenshot
      - click
      - form_input
      - javascript_eval
      - read_dom
      - network_monitoring
    required_for:
      - evidence-collector
      - reality-checker
      - codepen-explorer
    validation_command: null
    cli_available: false
    install_notes: "Plugin nativo Claude Code — requiere extensión Chrome"
    risks:
      - "Requiere extensión Chrome instalada y activa"
      - "No soporta Firefox/Safari"

  - id: claude_preview
    name: "Claude Preview"
    provider: "Anthropic"
