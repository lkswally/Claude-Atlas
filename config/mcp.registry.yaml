      - frontend-developer
      - evidence-collector
    validation_command: null
    cli_available: false
    install_notes: "Plugin nativo Claude Code"
    risks:
      - "Solo disponible en Claude Desktop (Windows/Mac), no en CLI"

  - id: playwright
    name: "Playwright MCP"
    provider: "Microsoft"
    status: CLI_ONLY
    config_scope: unknown
    live_tool_prefix: "mcp__playwright__"
    capabilities:
      - browser_navigate
      - browser_screenshot
      - browser_click
      - browser_evaluate
      - browser_wait_for
    required_for:
      - evidence-collector
      - reality-checker
      - performance-benchmarker
    validation_command: "npx playwright --version"
    cli_available: true
    cli_version: "1.61.0"
    install_notes: |
      CLI disponible. Para MCP server:
      npx @playwright/mcp@latest
      Agregar a .mcp.json: { "playwright": { "command": "npx", "args": ["@playwright/mcp"] } }
    risks:
      - "Requiere navegadores instalados: npx playwright install chromium"

  # ─── COMPUTER CONTROL ───────────────────────────────────────────────────────

  - id: computer_use
