# ATLAS Test Registry — F24
# Authoritative declaration of all test suites: what they are, what layer they belong to,
# and when they run. The runner uses this instead of a raw glob.
#
# Layers:
#   unit        — pure imports, no subprocess, no external services  (<30s expected)
#   integration — subprocess to local tools/node, no live MCPs       (<120s expected)
#   system      — full pipeline, manipulates filesystem/settings      (<600s expected)
#   evidence    — requires live MCPs or external APIs                 (variable)
#   release     — runs only in --release mode                        (variable)
#   legacy      — not run automatically; archived coverage            (not executed)
#
# Status:
#   active      — runs in normal CI
#   skipped     — registered but excluded from all modes
#   legacy      — orphaned; historical record only

