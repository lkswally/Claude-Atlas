# ATLAS Projects Registry
# ========================
# Catalogo de proyectos conocidos por ATLAS.
# No modifica los proyectos — solo los registra para evitar perdida de contexto.
#
# SCHEMA POR ENTRY:
#   id:               str unico, snake_case
#   name:             str nombre legible
#   path:             str path absoluto en disco (no asumir portabilidad)
#   type:             "sibling_repo" | "embedded" | "submodule"
#                     - sibling_repo: repo git independiente, hermano del ATLAS repo
#                     - embedded: vive dentro del CWD de ATLAS (puede ser gitignored)
#                     - submodule: registrado como git submodule (en .gitmodules)
#   category:         (opcional) "ATLAS_PROJECT" | "ATLAS_EXTENSION"
#                     - ATLAS_PROJECT: proyecto de producto gestionado por ATLAS
#                     - ATLAS_EXTENSION: herramienta/addon conectado a ATLAS runtime
#   status:           "active" | "paused" | "archived" | "broken"
#   last_known_phase: str, ultimo bloque o fase conocido
#   summary:          str descripcion de 1-3 lineas
#   known_risks:      list[str] riesgos conocidos al momento del registro
#   next_steps:       list[str] proximos pasos conocidos
#   confidence:       "high" | "medium" | "low"
#   registered_at:    str fecha ISO (cuando se agrego esta entrada)
#
# Para agregar un proyecto: append una entry. NO modificar codigo.
# Para marcar como archivado: cambiar status a "archived". No borrar.
# Proyectos gitignored NO son basura — son proyectos activos fuera del core.

